{% extends 'dashboard/base.html' %}{% block content %}
<h1>Изменить сотрудника</h1>
<form class="employee-form edit-form" method="post">{% csrf_token %}
<label>Telegram ID<input name="telegram_id" value="{{ employee.telegram_id }}" readonly></label>
<label>ФИО<input name="full_name" value="{{ employee.full_name }}" required></label>
<label>Username<input name="username" value="{{ employee.username|default:'' }}"></label>
<label>Город<input name="city" value="{{ employee.city }}" required></label>
<label>Роддома через запятую<input name="maternity_hospital" value="{{ assigned_hospitals }}" required></label>
<label>Роль<select name="role"><option {% if employee.role == 'Медик' %}selected{% endif %}>Медик</option><option {% if employee.role == 'Оператор' %}selected{% endif %}>Оператор</option></select></label>
<label class="checkbox"><input type="checkbox" name="is_active" {% if employee.is_active %}checked{% endif %}> Доступ к боту разрешён</label>
<button>Сохранить изменения</button><a class="button-link secondary" href="{% url 'dashboard' %}">Отмена</a>
</form>{% endblock %}
