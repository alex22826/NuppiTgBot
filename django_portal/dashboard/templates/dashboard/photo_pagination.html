{% if summary.photo_count and photo_page_count > 1 %}<nav class="pagination" aria-label="Страницы фотографий">
<span>Показаны {{ photo_page_start }}–{{ photo_page_end }} из {{ summary.photo_count }}</span>
<div class="btn-row">{% if photo_page_previous %}<a class="btn btn-secondary btn-sm" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ photo_page_previous }}">← Назад</a>{% endif %}<strong>Страница {{ photo_page }} из {{ photo_page_count }}</strong>{% if photo_page_next %}<a class="btn btn-sm" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ photo_page_next }}">Дальше →</a>{% endif %}</div>
</nav>{% endif %}
